# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Email Agent Evals"

defaultTest:
  options:
    disableVarExpansion: true
    provider: ollama:chat:qwen2.5:7b-instruct
  assert:
  - type: javascript
    value: file://grader.ts:rawTextResponse
  - type: javascript
    value: file://grader.ts:correctToolCall
  - type: javascript
    value: file://grader.ts:groundedSettings
  - type: javascript
    value: file://grader.ts:correctToolCallErrorMessage

evaluateOptions:
  repeat: 10

prompts:
  - "{{ turns }}"
  
providers:
  - "provider.ts"

tests:
- vars:
    turns:
    - how do I set up my email?
    - my email domain is gmail.com
  assert:
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response asks for details of the email address or domain name.
    transform: context.metadata.replies[0]
  - type: llm-rubric
    # Claude, 29 Oct 2026 (wording approved by Dirk): shape, not content - MiniCheck checks the ask (Q-20, R6)
    value: The reply opens directly with its question - no apology, no reference to a lookup, no preamble.
    transform: context.metadata.replies[0]
  - type: icontains
    value: imap.gmail.com
  - type: icontains
    value: smtp.gmail.com
  - type: icontains
    value: 993
  - type: icontains
    value: 465
  - type: llm-rubric
    value: ensure that the output contains server and port information for gmail.com
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response contains server name and port information for gmail.com.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - gmail.com

- vars:
    turns:
    - how do I set up my gmail.com email address on thunderbird?
  assert:
  - type: icontains
    value: imap.gmail.com
  - type: icontains
    value: smtp.gmail.com
  - type: icontains
    value: 993
  - type: icontains
    value: 465
  - type: llm-rubric
    value: ensure that the output contains server and port information for gmail.com.
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response contains server name and port information for gmail.com.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - gmail.com

- vars:
    turns:
    - how do I set up my test@gmail.com email address on thunderbird?
  assert:
  - type: icontains
    value: imap.gmail.com
  - type: icontains
    value: smtp.gmail.com
  - type: icontains
    value: 993
  - type: icontains
    value: 465
  - type: llm-rubric
    value: ensure that the output contains server and port information for gmail.com.
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response contains server name and port information for gmail.com.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - gmail.com

- vars:
    # Claude, 29 Oct 2026 (Dirk: "make something up"): example.com is a reserved example domain that
    # bigger models recognise as a placeholder (Q-30). Made-up domain, unregistered and not in the ISPDB.
    turns: 
    - how do I set up my wattlebay-plumbing.com.au email address on thunderbird?
    - yes, it is spelled correctly
  assert:
  # Claude, 1 Nov 2026: two-step S4 (Dirk) - turn 1 = SPEC S4, turn 2 = SPEC S6; cases 4 and 7 share these
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response asks the user to check the spelling of the domain.
    transform: context.metadata.replies[0]
  - type: llm-rubric
    value: The reply says the domain was not found and asks the user to check its spelling. A pointer to the email provider is allowed. Fail it if it adds anything else - a reason why the lookup failed (other than a possible typo), a list of settings to ask for, another place to look, or example providers.
    transform: context.metadata.replies[0]
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response tells the user to get the settings from their email provider.
  - type: llm-rubric
    value: The reply points the user to their email provider for the settings. Fail it if it adds anything else - settings, a list of settings to ask for, a reason why the lookup failed, another place to look, or example providers.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - wattlebay-plumbing.com.au
      repeatLast: true   # SPEC S6: the same domain may be looked up again on turn 2

- vars:
    turns: 
    - how do I set up my gmial.com email address on thunderbird?
    - sorry, it should be gmail.com
  assert:
  # Claude, 30 Oct 2026 (Dirk: naming the likely correction is a pass; the provider pointer is not needed): SPEC S4, case 5 form
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response asks the user to check the spelling of the domain or suggests a corrected spelling.
    transform: context.metadata.replies[0]
  - type: llm-rubric
    value: The reply says the domain was not found and asks the user to check its spelling or to confirm a suggested correction. A pointer to the email provider is allowed. Fail it if it adds anything else - a reason why the lookup failed (other than a possible typo), settings, or another place to look.
    transform: context.metadata.replies[0]
  - type: icontains
    value: imap.gmail.com
  - type: icontains
    value: smtp.gmail.com
  - type: icontains
    value: 993
  - type: icontains
    value: 465
  - type: llm-rubric
    value: ensure that the output contains server and port information
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response contains server name and port information.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - gmial.com   # user turn 1
      - gmail.com   # user turn 2

- vars:
    turns: 
    - how do I set up my email address on thunderbird?
  assert:
  - type: llm-rubric
    # Claude, 29 Oct 2026 (wording approved by Dirk): shape, not content - MiniCheck checks the ask (Q-20, R6)
    value: The reply opens directly with its question - no apology, no reference to a lookup, no preamble.
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response asks the user for their email domain.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains: []

- vars:
    # Claude, 29 Oct 2026 (Dirk: "make something up"): example.com is a reserved example domain that
    # bigger models recognise as a placeholder (Q-30). Made-up domain, unregistered and not in the ISPDB.
    turns: 
    - how do I set up my sam@kestrelridge-studio.net email address on thunderbird?
    - yes, it is spelled correctly
  assert:
  # Claude, 1 Nov 2026: two-step S4 (Dirk) - turn 1 = SPEC S4, turn 2 = SPEC S6; cases 4 and 7 share these
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response asks the user to check the spelling of the domain.
    transform: context.metadata.replies[0]
  - type: llm-rubric
    value: The reply says the domain was not found and asks the user to check its spelling. A pointer to the email provider is allowed. Fail it if it adds anything else - a reason why the lookup failed (other than a possible typo), a list of settings to ask for, another place to look, or example providers.
    transform: context.metadata.replies[0]
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response tells the user to get the settings from their email provider.
  - type: llm-rubric
    value: The reply points the user to their email provider for the settings. Fail it if it adds anything else - settings, a list of settings to ask for, a reason why the lookup failed, another place to look, or example providers.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - kestrelridge-studio.net
      repeatLast: true   # SPEC S6: the same domain may be looked up again on turn 2

- vars:
    turns:
    - how do I set up my posteo.de email address on thunderbird?
  assert:
  - type: icontains
    value: posteo.de
  - type: icontains
    value: 993
  - type: not-icontains
    value: imap.posteo.de
  - type: icontains-any
    value: ['465', '587']
  - type: not-icontains
    value: smtp.posteo.de
  - type: llm-rubric
    value: ensure that the output contains server and port information for posteo.de.
  - type: javascript
    value: file://grader.ts:yesNo
    config:
      claim: The response contains server name and port information for posteo.de.
  - type: javascript
    value: file://grader.ts:correctDomain
    config:
      domains:
      - posteo.de
